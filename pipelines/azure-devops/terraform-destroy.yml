trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: '1.8.5'
  - script: terraform init
    workingDirectory: environments/dev/platform
    displayName: terraform init
  - script: terraform plan -destroy -out=tfdestroy -input=false
    workingDirectory: environments/dev/platform
    displayName: terraform plan destroy
  - script: terraform apply -input=false tfdestroy
    workingDirectory: environments/dev/platform
    displayName: terraform apply destroy plan
