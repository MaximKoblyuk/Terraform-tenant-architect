trigger: none

stages:
  - stage: Plan
    jobs:
      - job: PlanInfra
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.8.5'
          - script: terraform init
            workingDirectory: environments/prod/platform
            displayName: terraform init
          - script: terraform plan -out=tfplan -input=false
            workingDirectory: environments/prod/platform
            displayName: terraform plan
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: environments/prod/platform/tfplan
              artifact: prod-tfplan

  - stage: Apply
    dependsOn: Plan
    jobs:
      - deployment: ApplyInfra
        environment: prod
        strategy:
          runOnce:
            deploy:
              pool:
                vmImage: ubuntu-latest
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: '1.8.5'
                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifactName: prod-tfplan
                    targetPath: environments/prod/platform
                - script: terraform init
                  workingDirectory: environments/prod/platform
                  displayName: terraform init
                - script: terraform apply -input=false tfplan
                  workingDirectory: environments/prod/platform
                  displayName: terraform apply
