name: terraform-apply

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Terraform init
        run: terraform init
        working-directory: environments/prod/platform
      - name: Terraform apply
        run: terraform apply -auto-approve
        working-directory: environments/prod/platform
