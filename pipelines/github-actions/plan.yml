name: terraform-plan

on:
  workflow_dispatch:
    inputs:
      stack_path:
        description: "Terraform stack path"
        required: true
        default: "environments/dev/platform"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Build Artifact Name
        id: artifact_meta
        run: echo "name=terraform-plan-$(echo '${{ github.event.inputs.stack_path }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Terraform Init
        run: terraform -chdir=${{ github.event.inputs.stack_path }} init
      - name: Terraform Validate
        run: terraform -chdir=${{ github.event.inputs.stack_path }} validate
      - name: Terraform Plan
        run: terraform -chdir=${{ github.event.inputs.stack_path }} plan -out=tfplan
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.name }}
          path: ${{ github.event.inputs.stack_path }}/tfplan
